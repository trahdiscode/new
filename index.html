<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trahdis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            background-color: #0a0a0a;
        }
        body {
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
        }

        /* Title bar */
        .titlebar {
            height: 34px;
            background: #1a1a1a;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            padding: 0 12px;
            flex-shrink: 0;
        }
        .dots {
            display: flex;
            gap: 8px;
            margin-right: 14px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .titlebar .filename {
            color: #777;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            flex: 1;
            text-align: center;
            margin-right: 60px; /* offset so it centers relative to full bar, not remaining space */
        }

        /* Terminal body */
        .terminal {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            font-size: 0.95rem;
            line-height: 1.6;
            cursor: text;
        }
        .line { white-space: pre-wrap; word-break: break-word; }
        .active-line {
            display: flex;
        }
        .active-line .prefix {
            white-space: pre;
            margin-right: 6px;
        }
        .typed {
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            unicode-bidi: plaintext;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background: #00ff41;
            margin-left: 1px;
            animation: blink 1s step-start infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        #hidden-input {
            position: absolute;
            top: 0;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
            width: 200px;
            height: 20px;
            direction: ltr;
            unicode-bidi: plaintext;
            text-align: left;
        }
        .terminal::-webkit-scrollbar { width: 8px; }
        .terminal::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="titlebar">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="filename">zsh — 80×24</div>
    </div>

    <div class="terminal" id="terminal">
        <div class="line">Welcome. This terminal has opinions. Type 'help' to begin.</div>
        <div class="active-line">
            <span class="prefix">visitor@trahdis:~$</span>
            <span class="typed" id="typed"></span><span class="cursor"></span>
        </div>
        <input type="text" id="hidden-input" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const typed = document.getElementById('typed');
        const hiddenInput = document.getElementById('hidden-input');
        const activeLine = document.querySelector('.active-line');

        const responses = {
            help: "Available commands: whoami, sudo reveal-identity, status, projects, contact, joke, hello, clear, help",
            whoami: "nice try.",
            "sudo reveal-identity": "Permission denied: you are not root here.",
            status: "Building something. Ask again later.",
            projects: "Classified. Check back after launch.",
            contact: "Still deciding if you deserve that. Try again later.",
            ls: "you.txt  regrets.log  README (empty)",
            pwd: "/nowhere/near/you",
            oomb: "nee etha naaye"
            oomf: "nee etha naaye"
            umb: "nee etha naaye"
            
            
        };

        const jokes = [
            "Why do programmers prefer dark mode? Because light attracts bugs.",
            "There are 10 types of people: those who understand binary and those who don't.",
            "A SQL query walks into a bar, walks up to two tables and asks: 'Can I join you?'",
            "Why do Java developers wear glasses? Because they don't C#.",
            "I told a joke about UDP. You might not get it.",
            "!false — it's funny because it's true.",
            "Why was the JavaScript developer sad? Because they didn't Node how to Express themselves.",
            "In order to understand recursion, you must first understand recursion.",
            "A programmer's wife says 'buy a loaf of bread, and if they have eggs, get a dozen.' He came home with 12 loaves of bread.",
            "Why do programmers hate nature? Too many bugs and no debugger."
        ];

        const helloReplies = [
            "Hello. This terminal was expecting someone taller.",
            "Hey. State your business, or don't — I'm not paid enough to care.",
            "Greetings, visitor. Root access still not included.",
            "Hi there. Yes, I'm judging your typing speed.",
            "Well hello. This is the part where I pretend to be helpful."
        ];

        function randomFrom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function scrollToBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        function addLine(text) {
            const div = document.createElement('div');
            div.className = 'line';
            div.textContent = text;
            terminal.insertBefore(div, activeLine);
            scrollToBottom();
        }

        function handleCommand(raw) {
            const cmd = raw.trim();
            addLine('visitor@trahdis:~$ ' + cmd);
            if (cmd === '') return;
            const lower = cmd.toLowerCase();
            if (lower === 'clear') {
                document.querySelectorAll('.terminal > .line').forEach(el => el.remove());
                return;
            }
            if (lower === 'joke') {
                addLine(randomFrom(jokes));
                return;
            }
            if (lower === 'hello' || lower === 'hi' || lower === 'hey') {
                addLine(randomFrom(helloReplies));
                return;
            }
            if (responses.hasOwnProperty(lower)) {
                addLine(responses[lower]);
            } else {
                addLine("command not found: " + cmd + " (try 'help')");
            }
        }

        hiddenInput.addEventListener('input', () => {
            typed.textContent = hiddenInput.value;
            scrollToBottom();
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleCommand(hiddenInput.value);
                hiddenInput.value = '';
                typed.textContent = '';
            }
        });

        terminal.addEventListener('click', () => hiddenInput.focus());
        hiddenInput.focus();
    </script>

</body>
</html>
